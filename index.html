<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <style>

        .card:hover {
            transform: scale(1.05);
            transition: transform 0.3s ease;

        }
        body { 
            font-family: sans-serif; 
            background-color: #f4f4f9; 
            margin: 0; 
            padding: 20px; 
            text-align: center; 
        }
        .corner-image {
            position: fixed;
            top: 0;
            left: 0;
            margin: 0;
            z-index: 1000;
            height: 155px;
            width: auto;
            object-fit: contain;
        }
        .corner-image2 {
            position: fixed;
            top: 0;
            right: 0;
            margin: 0;
            z-index: 1000;
            height: 155px;
            width: auto;
            object-fit: contain;
        }
        .corner-image3 {
            position: fixed;
            top: 150px;
            right: 0;
            margin: 0;
            z-index: 1000;
            height: 155px;
            width: auto;
            object-fit: contain;
        }
        .corner-image4 {
            position: fixed;
            top: 320px;
            left: 0;
            margin: 0;
            z-index: 1000;
            height: 155px;
            width: auto;
            object-fit: contain;
        }
        .corner-image5 {
            position: fixed;
            top: 320px;
            right: 0;
            margin: 0;
            z-index: 1000;
            height: 155px;
            width: auto;
            object-fit: contain;
        }
        .card { 
            background: white; 
            margin: 15px auto; 
            max-width: 450px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            padding: 8px 16px; 
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
        }

        .subject-link {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            color: #222;
            font-size: 22px;
            font-weight: 700;
            line-height: 1.3;
            padding: 10px 12px;
            border-radius: 8px;
            transition: color 0.25s ease, background-color 0.25s ease, transform 0.25s ease, text-shadow 0.25s ease;
        }

        .subject-link:hover {
            color: #ffffff;
            background: linear-gradient(135deg, #5b6cff, #8b5cf6);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
            transform: scale(1.02);
        }

        .card:hover {
            background-color: #f8f8ff;
            box-shadow: 0 10px 18px rgba(0,0,0,0.14);
        }
    </style>
</head>
